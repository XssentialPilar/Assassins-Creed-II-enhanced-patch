<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Tecla tallada keyboard and mouse keycaps</title>
  <desc id="desc">Four centered widths with translucent graphite and opaque ivory faces. Mouse buttons, Shift and Space use alpha masks.</desc>
  <defs>
    <linearGradient id="graphite" x2="0" y2="1">
      <stop stop-color="#444341"/>
      <stop offset="1" stop-color="#111110"/>
    </linearGradient>
    <g id="released" fill="url(#graphite)" fill-opacity=".82" stroke="#f6eee0" stroke-width="4">
      <rect x="22" y="21" width="84" height="86" rx="15"/>
      <rect x="143" y="21" width="98" height="86" rx="15"/>
      <rect x="264" y="21" width="112" height="86" rx="15"/>
      <rect x="388" y="21" width="120" height="86" rx="15"/>
    </g>
    <g id="bevel" fill="none" stroke-width="2">
      <rect x="27" y="26" width="74" height="76" rx="11"/>
      <rect x="148" y="26" width="88" height="76" rx="11"/>
      <rect x="269" y="26" width="102" height="76" rx="11"/>
      <rect x="393" y="26" width="110" height="76" rx="11"/>
    </g>
    <path id="mouse" d="M-2.8,-9 H2.8 A5,5 0 0 1 7.8,-4 V3.8 A5.2,5.2 0 0 1 2.6,9 H-2.6 A5.2,5.2 0 0 1 -7.8,3.8 V-4 A5,5 0 0 1 -2.8,-9 Z M-7.4,-.7 H7.4 M0,-8.5 V-.7"
          fill="none" stroke="#fff" stroke-width="1.27" stroke-linejoin="round"/>
    <path id="mouse-left" d="M-.9,-7.65 H-2.8 A3.6,3.6 0 0 0 -6.45,-4 V-1.65 H-.9 Z" fill="#fff"/>
    <path id="shift" d="M0,-8 7,-1 H3.2 V7 H-3.2 V-1 H-7 Z"
          fill="none" stroke="#fff" stroke-width="1.45" stroke-linejoin="round"/>
  </defs>
  <use href="#released"/>
  <use href="#bevel" stroke="#a09689"/>
  <g transform="translate(0 128)">
    <g fill="#f8f5ed" stroke="#282521" stroke-width="4">
      <rect x="22" y="21" width="84" height="86" rx="15"/>
      <rect x="143" y="21" width="98" height="86" rx="15"/>
      <rect x="264" y="21" width="112" height="86" rx="15"/>
      <rect x="388" y="21" width="120" height="86" rx="15"/>
    </g>
    <use href="#bevel" stroke="#a69d8f"/>
  </g>
  <g transform="translate(64 320) scale(2.65)">
    <use href="#mouse"/>
    <use href="#mouse-left"/>
  </g>
  <g transform="translate(192 320) scale(2.65)">
    <use href="#mouse"/>
    <use href="#mouse-left" transform="scale(-1 1)"/>
  </g>
  <g transform="translate(320 320) scale(2.65)">
    <use href="#mouse"/>
    <rect x="-1.5" y="-6.8" width="3" height="4.7" rx="1.2" fill="#fff"/>
  </g>
  <g transform="translate(448 320) scale(3)">
    <use href="#shift"/>
    <path d="M-10.7,2.5 -14.2,4.7 -10.7,6.9Z" fill="#fff"/>
  </g>
  <g transform="translate(64 448) scale(3)">
    <use href="#shift"/>
    <path d="M10.7,2.5 14.2,4.7 10.7,6.9Z" fill="#fff"/>
  </g>
  <path d="M163 438 V455 H221 V438" fill="none" stroke="#fff" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
