<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="640" height="128" viewBox="0 0 320 64">
  <title>DualShock 3 button prompts</title>
  <desc>Cross, Circle, Square, Triangle, L2, R2, L1, R1, Start and Select.</desc>
  <defs>
    <linearGradient id="idle-fill" x2="0" y2="1">
      <stop stop-color="#373842"/><stop offset="1" stop-color="#15161d"/>
    </linearGradient>
    <linearGradient id="idle-rim" x2="0" y2="1">
      <stop stop-color="#cacbd1"/><stop offset="1" stop-color="#767984"/>
    </linearGradient>
    <linearGradient id="held-fill" x2="0" y2="1">
      <stop stop-color="#252932"/><stop offset="1" stop-color="#0e141d"/>
    </linearGradient>
    <linearGradient id="held-rim" x2="0" y2="1">
      <stop stop-color="#f0f1f6"/><stop offset="1" stop-color="#a5b1c8"/>
    </linearGradient>
    <g id="cap">
      <circle cx="16" cy="16" r="13.6" stroke-width="1.2"/>
      <circle cx="16" cy="16" r="11.85" fill="none" stroke="#676a75" stroke-width=".52"/>
    </g>
    <g id="caps">
      <use xlink:href="#cap" x="0"/><use xlink:href="#cap" x="32"/><use xlink:href="#cap" x="64"/><use xlink:href="#cap" x="96"/><use xlink:href="#cap" x="128"/>
      <use xlink:href="#cap" x="160"/><use xlink:href="#cap" x="192"/><use xlink:href="#cap" x="224"/><use xlink:href="#cap" x="256"/><use xlink:href="#cap" x="288"/>
    </g>
    <style>
      .mark { fill:none; stroke-width:2.05; stroke-linecap:round; stroke-linejoin:round }
      .label { font-family:"Segoe UI",sans-serif; font-weight:700; font-size:13px; fill:#f1f1f4; text-anchor:middle }
      .compact { font-size:6.05px; letter-spacing:.05px }
    </style>
    <g id="legends">
      <g><path class="mark" stroke="#98b9f3" d="m10.2 10.2 11.6 11.6m0-11.6L10.2 21.8"/></g>
      <g transform="translate(32)"><circle class="mark" cx="16" cy="16" r="7.3" stroke="#f096a0"/></g>
      <g transform="translate(64)"><rect class="mark" x="9.7" y="9.7" width="12.6" height="12.6" rx=".1" stroke="#e1a6dc"/></g>
      <g transform="translate(96)"><path class="mark" stroke="#91dcc6" d="m16 8.4 8 14.2H8Z"/></g>
      <g transform="translate(128)"><text x="16" y="20.6" class="label">L2</text></g>
      <g transform="translate(160)"><text x="16" y="20.6" class="label">R2</text></g>
      <g transform="translate(192)"><text x="16" y="20.6" class="label">L1</text></g>
      <g transform="translate(224)"><text x="16" y="20.6" class="label">R1</text></g>
      <g transform="translate(256)"><text x="16" y="15" class="label compact">START</text><path d="m14 17.5 5 2.5-5 2.5Z" fill="#c5c7cd"/></g>
      <g transform="translate(288)"><text x="16" y="15" class="label compact">SELECT</text><rect x="12" y="18.3" width="8" height="3.5" rx=".65" fill="#c5c7cd"/></g>
    </g>
  </defs>
  <g transform="translate(0 0)">
    <use xlink:href="#caps" fill="url(#idle-fill)" fill-opacity=".59" stroke="url(#idle-rim)"/>
    <use xlink:href="#legends"/>
  </g>
  <g transform="translate(0 32)">
    <use xlink:href="#caps" fill="url(#held-fill)" fill-opacity=".84" stroke="url(#held-rim)"/>
    <use xlink:href="#legends"/>
  </g>
</svg>
