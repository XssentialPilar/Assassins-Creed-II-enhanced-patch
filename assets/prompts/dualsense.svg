<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="640" height="128" viewBox="0 0 320 64">
  <title>DualSense button prompts</title>
  <desc>Cross, Circle, Square, Triangle, L2, R2, L1, R1, Options and Create.</desc>
  <defs>
    <linearGradient id="idle-fill" x2="0" y2="1">
      <stop stop-color="#f5f6fa"/><stop offset="1" stop-color="#e1e5eb"/>
    </linearGradient>
    <linearGradient id="idle-rim" x2="0" y2="1">
      <stop stop-color="#ffffff"/><stop offset="1" stop-color="#b7c0cc"/>
    </linearGradient>
    <linearGradient id="held-fill" x2="0" y2="1">
      <stop stop-color="#d9dfe8"/><stop offset="1" stop-color="#bec9d7"/>
    </linearGradient>
    <linearGradient id="held-rim" x2="0" y2="1">
      <stop stop-color="#9ba8b8"/><stop offset="1" stop-color="#526278"/>
    </linearGradient>
    <g id="cap">
      <circle cx="16" cy="16" r="13.6" stroke-width="1.2"/>
      <circle cx="16" cy="16" r="11.85" fill="none" stroke="#aab5c2" stroke-width=".52"/>
    </g>
    <g id="caps">
      <use xlink:href="#cap" x="0"/><use xlink:href="#cap" x="32"/><use xlink:href="#cap" x="64"/><use xlink:href="#cap" x="96"/><use xlink:href="#cap" x="128"/>
      <use xlink:href="#cap" x="160"/><use xlink:href="#cap" x="192"/><use xlink:href="#cap" x="224"/><use xlink:href="#cap" x="256"/><use xlink:href="#cap" x="288"/>
    </g>
    <style>
      .mark { stroke:#394555; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; fill:none }
      .label { fill:#394555; font-family:"Segoe UI",sans-serif; font-weight:700; font-size:13px; text-anchor:middle }
    </style>
    <g id="legends">
      <g><path class="mark" d="m10 10 12 12m0-12L10 22"/></g>
      <g transform="translate(32)"><circle class="mark" cx="16" cy="16" r="7.1"/></g>
      <g transform="translate(64)"><rect class="mark" x="9.6" y="9.6" width="12.8" height="12.8" rx=".1"/></g>
      <g transform="translate(96)"><path class="mark" d="m16 8.4 8 14.2H8Z"/></g>
      <g transform="translate(128)"><text x="16" y="20.5" class="label">L2</text></g>
      <g transform="translate(160)"><text x="16" y="20.5" class="label">R2</text></g>
      <g transform="translate(192)"><text x="16" y="20.5" class="label">L1</text></g>
      <g transform="translate(224)"><text x="16" y="20.5" class="label">R1</text></g>
      <g transform="translate(256)"><path class="mark" d="M10.8 12h10.4m-10.4 4h10.4m-10.4 4h10.4"/></g>
      <g transform="translate(288)"><path class="mark" d="M10 18.9h5.2m-3.8-7.4 4.7 4.6m2.7-6.3v5.4"/></g>
    </g>
  </defs>
  <g transform="translate(0 0)">
    <use xlink:href="#caps" fill="url(#idle-fill)" fill-opacity="1" stroke="url(#idle-rim)"/>
    <use xlink:href="#legends"/>
  </g>
  <g transform="translate(0 32)">
    <use xlink:href="#caps" fill="url(#held-fill)" fill-opacity="1" stroke="url(#held-rim)"/>
    <use xlink:href="#legends"/>
  </g>
</svg>
