<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="640" height="128" viewBox="0 0 320 64">
  <title>DualShock 4 button prompts</title>
  <desc>Cross, Circle, Square, Triangle, L2, R2, L1, R1, Options and Share.</desc>
  <defs>
    <linearGradient id="idle-fill" x2="0" y2="1">
      <stop stop-color="#424b54"/><stop offset="1" stop-color="#161c22"/>
    </linearGradient>
    <linearGradient id="idle-rim" x2="0" y2="1">
      <stop stop-color="#c4cbd2"/><stop offset="1" stop-color="#727d88"/>
    </linearGradient>
    <linearGradient id="held-fill" x2="0" y2="1">
      <stop stop-color="#252e39"/><stop offset="1" stop-color="#10161e"/>
    </linearGradient>
    <linearGradient id="held-rim" x2="0" y2="1">
      <stop stop-color="#e4ebf5"/><stop offset="1" stop-color="#8999b0"/>
    </linearGradient>
    <g id="cap">
      <circle cx="16" cy="16" r="13.6" stroke-width="1.2"/>
      <circle cx="16" cy="16" r="11.85" fill="none" stroke="#56606b" stroke-width=".52"/>
    </g>
    <g id="caps">
      <use xlink:href="#cap" x="0"/><use xlink:href="#cap" x="32"/><use xlink:href="#cap" x="64"/><use xlink:href="#cap" x="96"/><use xlink:href="#cap" x="128"/>
      <use xlink:href="#cap" x="160"/><use xlink:href="#cap" x="192"/><use xlink:href="#cap" x="224"/><use xlink:href="#cap" x="256"/><use xlink:href="#cap" x="288"/>
    </g>
    <style>
      .mark { fill:none; stroke-width:1.85; stroke-linecap:round; stroke-linejoin:round }
      .label { font-family:"Segoe UI",sans-serif; font-weight:700; font-size:12.5px; fill:#f4f7ff; text-anchor:middle }
      .compact { font-size:5.8px; letter-spacing:.02px }
    </style>
    <g id="legends">
      <g><path class="mark" stroke="#b4cafa" d="m10 10 12 12m0-12L10 22"/></g>
      <g transform="translate(32)"><circle class="mark" cx="16" cy="16" r="7.0" stroke="#ecabb4"/></g>
      <g transform="translate(64)"><rect class="mark" x="9.8" y="9.8" width="12.4" height="12.4" stroke="#d3b6e8"/></g>
      <g transform="translate(96)"><path class="mark" stroke="#a5d9d7" d="m16 8.3 7.8 14H8.2Z"/></g>
      <g transform="translate(128)"><text x="16" y="19.4" class="label">L2</text></g>
      <g transform="translate(160)"><text x="16" y="19.4" class="label">R2</text></g>
      <g transform="translate(192)"><text x="16" y="19.4" class="label">L1</text></g>
      <g transform="translate(224)"><text x="16" y="19.4" class="label">R1</text></g>
      <g transform="translate(256)"><text x="16" y="17.4" class="label compact">OPTIONS</text></g>
      <g transform="translate(288)"><text x="16" y="17.4" class="label compact">SHARE</text></g>
    </g>
  </defs>
  <g transform="translate(0 0)">
    <use xlink:href="#caps" fill="url(#idle-fill)" fill-opacity=".62" stroke="url(#idle-rim)"/>
    <use xlink:href="#legends"/>
  </g>
  <g transform="translate(0 32)">
    <use xlink:href="#caps" fill="url(#held-fill)" fill-opacity=".86" stroke="url(#held-rim)"/>
    <use xlink:href="#legends"/>
  </g>
</svg>
